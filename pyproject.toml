[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-viewer"
version = "0.1.0"
description = "A small image viewer and light editor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ro Black", email = "signaldirective@gmail.com" }]
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
]

[project.gui-scripts]
lumen = "lumen.__main__:main"

[tool.setuptools]
packages = ["lumen"]

[tool.setuptools.package-data]
lumen = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
